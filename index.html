<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>AI 聊天 - 多模型（有记忆）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 10px; }
    .app { width: 100%; max-width: 800px; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 90vh; }
    h2 { padding: 20px; background: linear-gradient(135deg, #0c8ce9, #16b1f5); color: white; font-weight: 600; text-align: center; }
    #chatBox { flex: 1; overflow-y: auto; padding: 20px; background: #fafafa; }
    .message { margin-bottom: 16px; display: flex; flex-direction: column; }
    .message.user { align-items: flex-end; }
    .message.assistant { align-items: flex-start; }
    .bubble { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; word-break: break-word; }
    .user .bubble { background: #007aff; color: white; border-bottom-right-radius: 4px; }
    .assistant .bubble { background: #e9e9ea; color: #1c1c1e; border-bottom-left-radius: 4px; }

    .waiting { opacity: 0.6; font-style: italic; }

    /* 推理过程样式 */
    .reasoning-box {
      margin-top: 8px;
      padding: 10px 14px;
      background: #f9f9f9;
      border-left: 3px solid #ff9500;
      border-radius: 6px;
      font-size: 13px;
      color: #555;
      white-space: pre-wrap;
      display: none;
    }
    .reasoning-box .header {
      font-size: 12px;
      color: #ff9500;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .controls { display: flex; align-items: center; gap: 12px; padding: 10px 15px; background: white; border-top: 1px solid #ddd; flex-wrap: wrap; }
    .controls label { font-size: 14px; cursor: pointer; }
    .controls select { margin-left: 4px; padding: 4px 8px; border-radius: 6px; border: 1px solid #ccc; }
    .form-area { display: flex; padding: 15px; gap: 10px; background: white; border-top: 1px solid #ddd; }
    #userInput { flex: 1; padding: 12px 16px; border: 1px solid #ccc; border-radius: 24px; font-size: 16px; outline: none; transition: border 0.2s; }
    #userInput:focus { border-color: #007aff; }
    button { padding: 12px 24px; background: #007aff; color: white; border: none; border-radius: 24px; font-size: 16px; cursor: pointer; transition: background 0.2s; font-weight: 500; }
    button:hover { background: #005ecb; }
    button:disabled { background: #a0c4ff; cursor: not-allowed; }
    .error .bubble { background: #ff3b30; color: white; }
    .slow-tag { font-size: 12px; background: #ff9500; color: white; padding: 2px 6px; border-radius: 8px; margin-left: 4px; }
  </style>
</head>
<body>
  <div class="app">
    <h2>💬 AI 聊天助手</h2>
    <div id="chatBox"></div>
    <div class="controls">
      <label for="modelSelect">模型：</label>
      <select id="modelSelect">
        <option value="deepseek-ai/deepseek-v3.1-terminus">DeepSeek V3.1 Terminus</option>
        <option value="minimaxai/minimax-m2.7">MiniMax M2.7</option>
        <option value="deepseek-ai/deepseek-v3.2">DeepSeek V3.2</option>
        <option value="nvidia/nemotron-3-super-120b-a12b">Nemotron 3 Super</option>
        <option value="qwen/qwen3.5-122b-a10b">Qwen 3.5 122B</option>
        <option value="qwen/qwen3-next-80b-a3b-thinking" selected>Qwen 3 Next 80B Thinking</option>
      </select>
      <input type="checkbox" id="thinkingToggle" disabled />
      <label for="thinkingToggle">🤔 深度思考 <span class="slow-tag" style="font-size:11px;">慢</span></label>
      <button id="clearHistoryBtn" style="background:#ff3b30; padding:8px 16px; font-size:14px;">清空记忆</button>
    </div>
    <div class="form-area">
      <input type="text" id="userInput" placeholder="输入消息..." autofocus />
      <button id="sendBtn" type="button">发送</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const modelSelect = document.getElementById('modelSelect');
    const thinkingToggle = document.getElementById('thinkingToggle');

    // ========== 消息历史 ==========
    let messageHistory = [];

    // 模型配置 — 千问支持可选思考
    const modelConfigs = {
      'deepseek-ai/deepseek-v3.1-terminus': {
        temperature: 0.2, top_p: 0.7, max_tokens: 8192, seed: 42,
        supportsThinking: false, defaultThinking: false,
        chat_template_kwargs: { thinking: false }
      },
      'minimaxai/minimax-m2.7': {
        temperature: 1, top_p: 0.95, max_tokens: 2048,
        supportsThinking: false, defaultThinking: false,
        chat_template_kwargs: {}
      },
      'deepseek-ai/deepseek-v3.2': {
        temperature: 1, top_p: 0.95, max_tokens: 2048, seed: 42,
        supportsThinking: false, defaultThinking: false,
        chat_template_kwargs: { thinking: false }
      },
      'nvidia/nemotron-3-super-120b-a12b': {
        temperature: 1, top_p: 0.95, max_tokens: 2048,
        supportsThinking: false, defaultThinking: false,
        chat_template_kwargs: { enable_thinking: false, reasoning_budget: 0 }
      },
      'qwen/qwen3.5-122b-a10b': {
        temperature: 0.70, top_p: 0.80, max_tokens: 16384,
        supportsThinking: true,          // 支持思考
        defaultThinking: false,          // 默认关闭
        thinkingKey: 'enable_thinking'   // 参数名
      },
      'qwen/qwen3-next-80b-a3b-thinking': {
        temperature: 0.6, top_p: 0.7, max_tokens: 4096, frequency_penalty: 0, presence_penalty: 0,
        supportsThinking: true,
        defaultThinking: false,
        thinkingKey: 'enable_thinking'
      }
    };

    // 切换模型时更新深度思考开关
    function updateThinkingToggle() {
      const model = modelSelect.value;
      const config = modelConfigs[model];
      if (config.supportsThinking) {
        thinkingToggle.disabled = false;
        thinkingToggle.checked = config.defaultThinking;
      } else {
        thinkingToggle.disabled = true;
        thinkingToggle.checked = false;
      }
    }
    modelSelect.addEventListener('change', updateThinkingToggle);
    updateThinkingToggle();

    const waitingPhrases = [
      '正在理解问题...',
      '正在组织语言...',
      '马上就好...',
      '正在查阅知识...',
      '正在整理思路...'
    ];
    let waitingIndex = 0;
    let waitingTimer = null;

    function addMessage(role, text, saveToHistory = true) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      msgDiv.appendChild(bubble);
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      if (saveToHistory) {
        messageHistory.push({ role, content: text });
      }
      return { msgDiv, bubble };
    }

    clearHistoryBtn.addEventListener('click', () => {
      messageHistory = [];
      chatBox.innerHTML = '';
      addMessage('assistant', '记忆已清空，我们可以重新开始啦！', false);
    });

    async function sendMessage() {
      const userMsg = userInput.value.trim();
      if (!userMsg) return;

      addMessage('user', userMsg);
      userInput.value = '';
      sendBtn.disabled = true;

      const { msgDiv: assistantMsgDiv, bubble: assistantBubble } = addMessage('assistant', '', false);

      const reasoningBox = document.createElement('div');
      reasoningBox.className = 'reasoning-box';
      reasoningBox.innerHTML = '<div class="header">🤔 推理过程</div><div class="content"></div>';
      reasoningBox.style.display = 'none';
      assistantMsgDiv.insertBefore(reasoningBox, assistantBubble);
      const reasoningContent = reasoningBox.querySelector('.content');
      let reasoningText = '';

      // 等待提示
      waitingIndex = 0;
      assistantBubble.textContent = waitingPhrases[0];
      assistantBubble.classList.add('waiting');
      waitingTimer = setInterval(() => {
        waitingIndex = (waitingIndex + 1) % waitingPhrases.length;
        assistantBubble.textContent = waitingPhrases[waitingIndex];
      }, 2000);

      const model = modelSelect.value;
      const config = modelConfigs[model];

      // 构建 chat_template_kwargs
      let chatTemplateKwargs = {};
      if (config.supportsThinking) {
        chatTemplateKwargs = { enable_thinking: thinkingToggle.checked };
      } else {
        chatTemplateKwargs = config.chat_template_kwargs;
      }

      const bodyParams = {
        model: model,
        messages: [
          ...messageHistory.map(m => ({ role: m.role, content: m.content }))
        ],
        temperature: config.temperature,
        top_p: config.top_p,
        max_tokens: config.max_tokens,
        stream: true,
        chat_template_kwargs: chatTemplateKwargs
      };
      if (config.seed !== undefined) bodyParams.seed = config.seed;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyParams),
        });

        if (!response.ok) throw new Error('HTTP 错误 ' + response.status);

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullReply = '';
        let firstChunk = true;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const jsonStr = line.substring(6).trim();
              if (jsonStr === '[DONE]') continue;
              try {
                const parsed = JSON.parse(jsonStr);
                const delta = parsed.choices?.[0]?.delta;

                // 处理推理内容
                if (delta?.reasoning_content) {
                  reasoningText += delta.reasoning_content;
                  reasoningContent.textContent = reasoningText;
                  reasoningBox.style.display = 'block';
                  if (!fullReply) assistantBubble.textContent = '正在深度思考...';
                  chatBox.scrollTop = chatBox.scrollHeight;
                }

                // 处理正式回答
                if (delta?.content) {
                  if (firstChunk) {
                    clearInterval(waitingTimer);
                    assistantBubble.classList.remove('waiting');
                    firstChunk = false;
                  }
                  fullReply += delta.content;
                  assistantBubble.textContent = fullReply;
                  chatBox.scrollTop = chatBox.scrollHeight;
                }
              } catch (e) {}
            }
          }
        }

        if (fullReply) {
          messageHistory.push({ role: 'assistant', content: fullReply });
        } else if (!reasoningText) {
          clearInterval(waitingTimer);
          assistantBubble.classList.remove('waiting');
          assistantBubble.textContent = '（无回复内容）';
        } else {
          // 只有推理没有正式回答，把推理当回答存
          messageHistory.push({ role: 'assistant', content: '[推理回复] ' + reasoningText });
        }

      } catch (err) {
        clearInterval(waitingTimer);
        assistantBubble.classList.remove('waiting');
        assistantBubble.textContent = '请求失败：' + err.message;
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
