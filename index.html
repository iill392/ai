<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>AI 聊天 - 多模型</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 10px; }
    .app { width: 100%; max-width: 800px; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 90vh; }
    h2 { padding: 20px; background: linear-gradient(135deg, #0c8ce9, #16b1f5); color: white; font-weight: 600; text-align: center; }
    #chatBox { flex: 1; overflow-y: auto; padding: 20px; background: #fafafa; }
    .message { margin-bottom: 16px; display: flex; flex-direction: column; }
    .message.user { align-items: flex-end; }
    .message.assistant { align-items: flex-start; }
    .bubble { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.4; word-break: break-word; }
    .user .bubble { background: #007aff; color: white; border-bottom-right-radius: 4px; }
    .assistant .bubble { background: #e9e9ea; color: #1c1c1e; border-bottom-left-radius: 4px; }
    .controls { display: flex; align-items: center; gap: 12px; padding: 10px 15px; background: white; border-top: 1px solid #ddd; flex-wrap: wrap; }
    .controls label { font-size: 14px; cursor: pointer; }
    .controls select, .controls input[type="checkbox"] { margin-left: 4px; }
    .form-area { display: flex; padding: 15px; gap: 10px; background: white; border-top: 1px solid #ddd; }
    #userInput { flex: 1; padding: 12px 16px; border: 1px solid #ccc; border-radius: 24px; font-size: 16px; outline: none; transition: border 0.2s; }
    #userInput:focus { border-color: #007aff; }
    button { padding: 12px 24px; background: #007aff; color: white; border: none; border-radius: 24px; font-size: 16px; cursor: pointer; transition: background 0.2s; font-weight: 500; }
    button:hover { background: #005ecb; }
    button:disabled { background: #a0c4ff; cursor: not-allowed; }
    .error .bubble { background: #ff3b30; color: white; }
    .slow-tag { font-size: 12px; background: #ff9500; color: white; padding: 2px 6px; border-radius: 8px; margin-left: 4px; }
  </style>
</head>
<body>
  <div class="app">
    <h2>💬 AI 聊天助手</h2>
    <div id="chatBox"></div>
    <div class="controls">
      <label for="modelSelect">模型：</label>
      <select id="modelSelect">
        <option value="deepseek-ai/deepseek-v3.1-terminus" selected>DeepSeek V3.1 Terminus ⚡</option>
        <option value="minimaxai/minimax-m2.7">MiniMax M2.7 ⚡</option>
        <option value="deepseek-ai/deepseek-v3.2">DeepSeek V3.2 🐢<span class="slow-tag">慢</span></option>
        <option value="nvidia/nemotron-3-super-120b-a12b">Nemotron 3 Super 🐢<span class="slow-tag">慢</span></option>
      </select>
      <input type="checkbox" id="thinkingToggle" />
      <label for="thinkingToggle">🤔 深度思考</label>
    </div>
    <div class="form-area">
      <input type="text" id="userInput" placeholder="输入消息..." autofocus />
      <button id="sendBtn" type="button">发送</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const thinkingToggle = document.getElementById('thinkingToggle');
    const modelSelect = document.getElementById('modelSelect');

    // 模型配置映射
    const modelConfigs = {
      'deepseek-ai/deepseek-v3.1-terminus': {
        temperature: 0.2,
        top_p: 0.7,
        max_tokens: 8192,
        seed: 42,
        supportsThinking: false,
        defaultThinking: false,
        chat_template_kwargs: { thinking: false }
      },
      'minimaxai/minimax-m2.7': {
        temperature: 1,
        top_p: 0.95,
        max_tokens: 8192,
        supportsThinking: false,
        defaultThinking: false,
        chat_template_kwargs: {}
      },
      'deepseek-ai/deepseek-v3.2': {
        temperature: 1,
        top_p: 0.95,
        max_tokens: 8192,
        seed: 42,
        supportsThinking: true,
        defaultThinking: true,
        chat_template_kwargs: { thinking: true }
      },
      'nvidia/nemotron-3-super-120b-a12b': {
        temperature: 1,
        top_p: 0.95,
        max_tokens: 16384,
        supportsThinking: true,
        defaultThinking: true,
        chat_template_kwargs: { enable_thinking: true, reasoning_budget: 16384 }
      }
    };

    // 模型切换时更新深度思考开关状态
    function updateThinkingToggle() {
      const model = modelSelect.value;
      const config = modelConfigs[model];
      if (config.supportsThinking) {
        thinkingToggle.disabled = false;
        thinkingToggle.checked = config.defaultThinking;
      } else {
        thinkingToggle.disabled = true;
        thinkingToggle.checked = false;
      }
    }

    modelSelect.addEventListener('change', updateThinkingToggle);
    // 页面加载时初始化
    updateThinkingToggle();

    function addMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      msgDiv.appendChild(bubble);
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return bubble;
    }

    async function sendMessage() {
      const userMsg = userInput.value.trim();
      if (!userMsg) return;

      addMessage('user', userMsg);
      userInput.value = '';
      sendBtn.disabled = true;

      const assistantBubble = addMessage('assistant', '思考中...');

      const model = modelSelect.value;
      const config = modelConfigs[model];
      // 构建 chat_template_kwargs，根据模型和开关决定
      let chatTemplateKwargs = {};
      if (config.supportsThinking) {
        // 对于支持思考的模型，使用开关状态覆盖默认值
        if (model === 'nvidia/nemotron-3-super-120b-a12b') {
          chatTemplateKwargs = {
            enable_thinking: thinkingToggle.checked,
            reasoning_budget: thinkingToggle.checked ? 16384 : 0  // 关闭时不发送 reasoning_budget
          };
        } else if (model === 'deepseek-ai/deepseek-v3.2') {
          chatTemplateKwargs = { thinking: thinkingToggle.checked };
        }
      } else {
        // 不支持思考的模型传固定值或空对象
        chatTemplateKwargs = config.chat_template_kwargs || {};
      }

      // 构建请求体
      const bodyParams = {
        model: model,
        messages: [{ role: 'user', content: userMsg }],
        temperature: config.temperature,
        top_p: config.top_p,
        max_tokens: config.max_tokens,
        stream: true,
        chat_template_kwargs: chatTemplateKwargs
      };
      // 只有配置中有 seed 时才添加
      if (config.seed !== undefined) bodyParams.seed = config.seed;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyParams),
        });

        if (!response.ok) throw new Error('HTTP 错误 ' + response.status);

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullReply = '';
        let lastUpdateTime = 0;
        const throttleInterval = 80; // 80ms 节流

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const jsonStr = line.replace('data: ', '').trim();
            if (jsonStr === '[DONE]') continue;
            try {
              const parsed = JSON.parse(jsonStr);
              const content = parsed.choices?.[0]?.delta?.content;
              if (content) {
                fullReply += content;
                const now = Date.now();
                if (now - lastUpdateTime > throttleInterval) {
                  assistantBubble.textContent = fullReply;
                  chatBox.scrollTop = chatBox.scrollHeight;
                  lastUpdateTime = now;
                }
              }
            } catch (e) {}
          }
          // 循环末尾强制更新
          assistantBubble.textContent = fullReply;
          chatBox.scrollTop = chatBox.scrollHeight;
        }
        if (!fullReply) assistantBubble.textContent = '（无回复内容）';
      } catch (err) {
        assistantBubble.textContent = '请求失败：' + err.message;
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
