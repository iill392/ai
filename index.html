<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>DeepSeek V4 Flash · AI 聊天助手</title>
    <meta name="theme-color" content="#f8f9fa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <!-- 代码高亮库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/css.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/xml.min.js">
    </script>

    <style>
        :root {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0f2f5;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-tertiary: #8888a0;
            --border-color: #e2e5ea;
            --accent: #4f6ef7;
            --accent-hover: #3b54d4;
            --accent-light: #eef0ff;
            --user-bubble: #4f6ef7;
            --user-text: #ffffff;
            --ai-bubble: #ffffff;
            --ai-text: #1a1a2e;
            --thinking-bg: #fffdf5;
            --thinking-border: #e8c858;
            --thinking-text: #8b6914;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.10);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --safe-bottom: env(safe-area-inset-bottom, 8px);
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #222240;
            --bg-tertiary: #2a2a48;
            --text-primary: #e8e8f0;
            --text-secondary: #b0b0c8;
            --text-tertiary: #7878a0;
            --border-color: #3a3a58;
            --accent: #6b8aff;
            --accent-hover: #8aa0ff;
            --accent-light: #1e2240;
            --user-bubble: #6b8aff;
            --user-text: #ffffff;
            --ai-bubble: #222240;
            --ai-text: #e8e8f0;
            --thinking-bg: #2a2418;
            --thinking-border: #5a4820;
            --thinking-text: #c8a050;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.30);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.40);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.50);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background var(--transition), color var(--transition);
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ========== 顶部导航栏 ========== */
        .navbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
            box-shadow: var(--shadow-sm);
            transition: background var(--transition), border-color var(--transition);
            min-height: 54px;
            gap: 10px;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            min-width: 0;
        }

        .navbar-brand .logo-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f6ef7, #6b8aff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(79, 110, 247, 0.3);
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            font-size: 1rem;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-icon:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--text-tertiary);
        }
        .btn-icon:active {
            transform: scale(0.93);
            transition: transform 0.1s;
        }
        .btn-icon.danger:hover {
            background: #fff0f0;
            border-color: #e06060;
            color: #d04040;
        }
        [data-theme="dark"] .btn-icon.danger:hover {
            background: #3a2020;
            border-color: #c04040;
            color: #f06060;
        }

        /* ========== 主聊天区域 ========== */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        .chat-container::-webkit-scrollbar {
            width: 5px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        .chat-container::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        /* ========== 空状态 ========== */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 16px;
            gap: 14px;
            animation: fadeInUp 0.6s ease-out;
            min-height: 280px;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .empty-state .welcome-icon {
            font-size: 3.5rem;
            margin-bottom: 4px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .empty-state h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .empty-state p {
            font-size: 0.9rem;
            color: var(--text-tertiary);
            max-width: 380px;
            line-height: 1.6;
        }
        .empty-state .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 6px;
        }
        .empty-state .suggestion-chip {
            padding: 9px 15px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.84rem;
            transition: all var(--transition);
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }
        .empty-state .suggestion-chip:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        .empty-state .suggestion-chip:active {
            transform: scale(0.96);
            transition: transform 0.1s;
        }

        /* ========== 消息气泡 ========== */
        .message {
            display: flex;
            gap: 9px;
            max-width: 86%;
            animation: messageIn 0.35s ease-out;
            flex-shrink: 0;
        }
        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.assistant {
            align-self: flex-start;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            margin-top: 2px;
            box-shadow: var(--shadow-sm);
            font-weight: 600;
        }
        .message.user .message-avatar {
            background: linear-gradient(135deg, #4f6ef7, #6b8aff);
            color: #fff;
        }
        .message.assistant .message-avatar {
            background: var(--bg-tertiary);
            font-size: 1.1rem;
        }

        .message-content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .message-bubble {
            padding: 11px 15px;
            border-radius: var(--radius-md);
            line-height: 1.62;
            font-size: 0.92rem;
            word-break: break-word;
            position: relative;
            box-shadow: var(--shadow-sm);
            transition: background var(--transition), color var(--transition);
        }
        .message.user .message-bubble {
            background: var(--user-bubble);
            color: var(--user-text);
            border-bottom-right-radius: 6px;
        }
        .message.assistant .message-bubble {
            background: var(--ai-bubble);
            color: var(--ai-text);
            border-bottom-left-radius: 6px;
            border: 1px solid var(--border-color);
        }

        /* 思考过程区块 */
        .thinking-block {
            background: var(--thinking-bg);
            border: 1px solid var(--thinking-border);
            border-radius: var(--radius-sm);
            padding: 9px 13px;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: var(--thinking-text);
            cursor: pointer;
            user-select: none;
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .thinking-block:hover {
            border-color: var(--thinking-text);
        }
        .thinking-header {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.2px;
        }
        .thinking-header .arrow {
            transition: transform var(--transition);
            font-size: 0.65rem;
            display: inline-block;
        }
        .thinking-block.collapsed .thinking-header .arrow {
            transform: rotate(-90deg);
        }
        .thinking-content {
            margin-top: 5px;
            line-height: 1.5;
            max-height: 400px;
            overflow-y: auto;
            transition: max-height 0.3s ease, margin-top 0.3s ease, opacity 0.3s ease;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .thinking-block.collapsed .thinking-content {
            max-height: 0;
            margin-top: 0;
            opacity: 0;
            overflow: hidden;
        }

        /* Markdown 内容样式 */
        .message-bubble p {
            margin: 0 0 7px 0;
        }
        .message-bubble p:last-child {
            margin-bottom: 0;
        }
        .message-bubble code {
            background: rgba(0, 0, 0, 0.07);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
            font-size: 0.84em;
        }
        [data-theme="dark"] .message-bubble code {
            background: rgba(255, 255, 255, 0.10);
        }
        .message.user .message-bubble code {
            background: rgba(255, 255, 255, 0.22);
            color: #fff;
        }
        .message-bubble pre {
            background: #1e1e2e;
            color: #e0e0f0;
            padding: 13px 15px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin: 7px 0;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
            font-size: 0.8em;
            line-height: 1.5;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
            -webkit-overflow-scrolling: touch;
        }
        .message-bubble pre code {
            background: transparent !important;
            padding: 0 !important;
            color: inherit !important;
            font-size: inherit;
        }
        .message-bubble ul,
        .message-bubble ol {
            margin: 5px 0;
            padding-left: 20px;
        }
        .message-bubble li {
            margin: 2px 0;
        }
        .message-bubble blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 11px;
            margin: 7px 0;
            color: var(--text-tertiary);
            font-style: italic;
        }
        .message-bubble table {
            border-collapse: collapse;
            margin: 7px 0;
            font-size: 0.84em;
            width: 100%;
        }
        .message-bubble th,
        .message-bubble td {
            border: 1px solid var(--border-color);
            padding: 5px 9px;
            text-align: left;
        }
        .message-bubble th {
            background: var(--bg-tertiary);
            font-weight: 600;
        }
        .message-bubble a {
            color: var(--accent);
            text-decoration: underline;
        }
        .message.user .message-bubble a {
            color: #fff;
        }

        /* 复制按钮 */
        .code-block-wrapper {
            position: relative;
            margin: 7px 0;
        }
        .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(255, 255, 255, 0.14);
            border: none;
            color: #ccc;
            padding: 4px 9px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.72rem;
            transition: all var(--transition);
            opacity: 0;
            z-index: 2;
            backdrop-filter: blur(4px);
            font-family: inherit;
        }
        .code-block-wrapper:hover .copy-btn,
        .code-block-wrapper:active .copy-btn {
            opacity: 1;
        }
        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.30);
            color: #fff;
        }
        .copy-btn.copied {
            background: #4caf84;
            color: #fff;
            opacity: 1;
        }

        /* ========== 输入区域 ========== */
        .input-area {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 10px 14px;
            padding-bottom: calc(10px + var(--safe-bottom));
            display: flex;
            align-items: flex-end;
            gap: 9px;
            flex-shrink: 0;
            z-index: 10;
            box-shadow: var(--shadow-md);
            transition: background var(--transition), border-color var(--transition);
        }
        .input-wrapper {
            flex: 1;
            position: relative;
            background: var(--bg-tertiary);
            border-radius: var(--radius-lg);
            border: 2px solid transparent;
            transition: all var(--transition);
            display: flex;
            align-items: flex-end;
            box-shadow: var(--shadow-sm);
        }
        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(79, 110, 247, 0.10);
        }
        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 11px 15px;
            font-size: 0.92rem;
            color: var(--text-primary);
            resize: none;
            min-height: 44px;
            max-height: 140px;
            line-height: 1.5;
            font-family: inherit;
            transition: color var(--transition);
            -webkit-user-select: text;
            user-select: text;
        }
        .input-wrapper textarea::placeholder {
            color: var(--text-tertiary);
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            flex-shrink: 0;
            box-shadow: 0 3px 12px rgba(79, 110, 247, 0.35);
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .send-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 5px 20px rgba(79, 110, 247, 0.45);
        }
        .send-btn:active {
            transform: scale(0.90);
            transition: transform 0.1s;
            box-shadow: 0 2px 8px rgba(79, 110, 247, 0.30);
        }
        .send-btn:disabled {
            background: #c0c0d0;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            opacity: 0.65;
        }
        [data-theme="dark"] .send-btn:disabled {
            background: #4a4a60;
            opacity: 0.5;
        }
        .send-btn .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2.5px solid transparent;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .send-btn.loading .send-icon {
            display: none;
        }
        .send-btn.loading .spinner {
            display: block;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 停止按钮 */
        .stop-btn {
            display: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #e06060;
            background: #fff;
            color: #e06060;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
            transition: all var(--transition);
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .stop-btn.visible {
            display: flex;
        }
        [data-theme="dark"] .stop-btn {
            background: #2a2a48;
        }
        .stop-btn:hover {
            background: #fff0f0;
            border-color: #c04040;
            color: #c04040;
        }
        [data-theme="dark"] .stop-btn:hover {
            background: #3a2020;
        }
        .stop-btn:active {
            transform: scale(0.90);
            transition: transform 0.1s;
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 22px;
            font-size: 0.84rem;
            z-index: 100;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-lg);
            text-align: center;
            max-width: 90vw;
            font-family: inherit;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            background: #e05050;
        }
        .toast.success {
            background: #4caf84;
        }

        /* 打字指示器 */
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 3px 0;
            align-items: center;
        }
        .typing-indicator span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-tertiary);
            animation: typingBounce 1.2s ease-in-out infinite;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.15s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.3s;
        }
        @keyframes typingBounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.35;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        /* 流式光标 */
        .streaming-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--accent);
            margin-left: 1px;
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* ========== 响应式设计 ========== */
        @media (max-width: 640px) {
            .message {
                max-width: 93%;
            }
            .navbar {
                padding: 10px 12px;
                min-height: 48px;
                gap: 6px;
            }
            .navbar-brand {
                font-size: 0.95rem;
                gap: 7px;
            }
            .navbar-brand .logo-icon {
                width: 30px;
                height: 30px;
                font-size: 1rem;
                border-radius: 8px;
            }
            .btn-icon {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }
            .input-area {
                padding: 8px 10px;
                padding-bottom: calc(8px + var(--safe-bottom));
                gap: 6px;
            }
            .input-wrapper textarea {
                padding: 10px 12px;
                font-size: 0.88rem;
                min-height: 40px;
            }
            .send-btn {
                width: 38px;
                height: 38px;

<body data-theme="light">

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="navbar-brand">
            <div class="logo-icon">✨</div>
            <span>DeepSeek V4 Flash</span>
        </div>
        <div class="navbar-actions">
            <button class="btn-icon" id="themeToggle" title="切换主题" aria-label="切换深色/浅色主题">🌓</button>
            <button class="btn-icon danger" id="clearChatBtn" title="清空对话" aria-label="清空对话">🗑️</button>
        </div>
    </nav>

    <!-- 聊天消息区域 -->
    <div class="chat-container" id="chatContainer">
        <!-- 空状态 -->
        <div class="empty-state" id="emptyState">
            <div class="welcome-icon">💬</div>
            <h2>开始对话吧</h2>
            <p>我是基于 <strong>DeepSeek V4 Flash</strong> 的 AI 助手，已开启<strong>深度推理模式</strong>，擅长解决复杂问题。</p>
            <div class="suggestions">
                <button class="suggestion-chip" data-prompt="请用简单的语言解释一下什么是人工智能？">🤖 什么是人工智能？</button>
                <button class="suggestion-chip" data-prompt="用Python写一个快速排序算法，并加上注释">💻 写快速排序代码</button>
                <button class="suggestion-chip" data-prompt="帮我分析一下：如果我想在一个月内学会前端开发，应该怎么安排学习计划？">📅 制定学习计划</button>
                <button class="suggestion-chip" data-prompt="推荐5本值得阅读的经典书籍，并简要说明理由">📚 推荐经典书籍</button>
            </div>
        </div>
    </div>

    <!-- 输入区域 -->
    <div class="input-area">
        <div class="input-wrapper">
            <textarea
            id="userInput"
            rows="1"
            placeholder="输入消息，Enter 发送，Shift+Enter 换行..."
            aria-label="输入消息"
            enterkeyhint="send"
            autocapitalize="off"
            autocomplete="off"
            spellcheck="false"
        ></textarea>
    </div>
    <button class="send-btn" id="sendBtn" aria-label="发送消息">
        <span class="send-icon">➤</span>
        <span class="spinner"></span>
    </button>
    <button class="stop-btn" id="stopBtn" aria-label="停止生成" title="停止生成">⏹</button>
</div>

<script>
    (function() {
        // ==================== 配置 ====================
        const CONFIG = {
            // API 端点（保持不变）
            apiEndpoint: '/api/chat',
            // 模型名称（保持不变）
            model: 'deepseek-ai/deepseek-v4-flash',
            // 请求参数（保持不变）
            temperature: 1,
            topP: 0.95,
            maxTokens: 16384,
            chatTemplateKwargs: {
                thinking: true,
                reasoning_effort: 'high'
            },
            // 存储键名
            storageKey: 'deepseek_chat_conversations_v4',
            themeKey: 'deepseek_chat_theme_v4',
        };

        // ==================== DOM 元素 ====================
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');
        const themeToggle = document.getElementById('themeToggle');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const toast = document.getElementById('toast');

        // ==================== 状态 ====================
        let messages = [];
        let isGenerating = false;
        let abortController = null;
        let currentAssistantMessageEl = null;
        let currentThinkingContent = '';
        let currentContent = '';
        let streamBuffer = '';

        // ==================== 初始化 ====================
        function init() {
            loadTheme();
            loadConversation();
            setupEventListeners();
            updateEmptyState();
            autoResizeTextarea();
            userInput.focus();
        }

        // ==================== 主题管理 ====================
        function loadTheme() {
            const saved = localStorage.getItem(CONFIG.themeKey);
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            setTheme(theme, false);
        }

        function setTheme(theme, save = true) {
            document.body.setAttribute('data-theme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌓';
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) {
                metaTheme.content = theme === 'dark' ? '#1a1a2e' : '#f8f9fa';
            }
            if (save) {
                localStorage.setItem(CONFIG.themeKey, theme);
            }
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        }

        // ==================== 对话历史管理 ====================
        function loadConversation() {
            try {
                const saved = localStorage.getItem(CONFIG.storageKey);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        messages = parsed;
                        renderAllMessages();
                    }
                }
            } catch (e) {
                console.warn('加载对话历史失败:', e);
                messages = [];
            }
        }

        function saveConversation() {
            try {
                // 只保存 role 和 content 以及 thinkingContent
                const toSave = messages.map(m => ({
                    role: m.role,
                    content: m.content,
                    thinkingContent: m.thinkingContent || ''
                }));
                localStorage.setItem(CONFIG.storageKey, JSON.stringify(toSave));
            } catch (e) {
                console.warn('保存对话历史失败:', e);
            }
        }

        function clearConversation() {
            if (isGenerating) {
                showToast('请先停止当前生成', 'error');
                return;
            }
            if (messages.length === 0) {
                showToast('对话已经是空的啦~', 'success');
                return;
            }
            messages = [];
            chatContainer.innerHTML = '';
            const newEmptyState = createEmptyState();
            chatContainer.appendChild(newEmptyState);
            updateEmptyState();
            saveConversation();
            showToast('对话已清空 ✓', 'success');
            bindSuggestionChipsInElement(newEmptyState);
        }

        function createEmptyState() {
            const div = document.createElement('div');
            div.className = 'empty-state';
            div.id = 'emptyState';
            div.innerHTML = `
                    <div class="welcome-icon">💬</div>
                    <h2>开始对话吧</h2>
                    <p>我是基于 <strong>DeepSeek V4 Flash</strong> 的 AI 助手，已开启<strong>深度推理模式</strong>，擅长解决复杂问题。</p>
                    <div class="suggestions">
                        <button class="suggestion-chip" data-prompt="请用简单的语言解释一下什么是人工智能？">🤖 什么是人工智能？</button>
                        <button class="suggestion-chip" data-prompt="用Python写一个快速排序算法，并加上注释">💻 写快速排序代码</button>
                        <button class="suggestion-chip" data-prompt="帮我分析一下：如果我想在一个月内学会前端开发，应该怎么安排学习计划？">📅 制定学习计划</button>
                        <button class="suggestion-chip" data-prompt="推荐5本值得阅读的经典书籍，并简要说明理由">📚 推荐经典书籍</button>
                    </div>
                `;
            bindSuggestionChipsInElement(div);
            return div;
        }

        function updateEmptyState() {
            const es = document.getElementById('emptyState');
            if (messages.length === 0 && !isGenerating) {
                if (!es) {
                    const newEs = createEmptyState();
                    chatContainer.appendChild(newEs);
                }
            } else {
                if (es) {
                    es.remove();
                }
            }
        }

        function renderAllMessages() {
            chatContainer.innerHTML = '';
            messages.forEach((msg) => {
                if (msg.role === 'user') {
                    appendUserMessage(msg.content, false);
                } else if (msg.role === 'assistant') {
                    appendAssistantMessage(msg.content, msg.thinkingContent || '', false);
                }
            });
            updateEmptyState();
            scrollToBottom(false);
        }

        // ==================== 消息渲染 ====================
        function appendUserMessage(content, save = true) {
            const emptyStateEl = document.getElementById('emptyState');
            if (emptyStateEl) emptyStateEl.remove();

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user';
            msgDiv.innerHTML = `
                    <div class="message-avatar">👤</div>
                    <div class="message-content-wrapper">
                        <div class="message-bubble">${escapeHtml(content)}</div>
                    </div>
                `;
            chatContainer.appendChild(msgDiv);
            scrollToBottom(true);

            if (save) {
                messages.push({ role: 'user', content: content });
                saveConversation();
            }
        }

        function appendAssistantMessage(content, thinkingContent, save = true) {
            const emptyStateEl = document.getElementById('emptyState');
            if (emptyStateEl) emptyStateEl.remove();

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant';
            msgDiv.setAttribute('data-role', 'assistant');

            let thinkingHtml = '';
            if (thinkingContent && thinkingContent.trim()) {
                thinkingHtml = `
                        <div class="thinking-block" data-collapsed="false">
                            <div class="thinking-header">
                                <span class="arrow">▼</span> 💭 <span>深度思考</span>
                            </div>
                            <div class="thinking-content">${escapeHtml(thinkingContent)}</div>
                        </div>
                    `;
            }

            const renderedContent = renderMarkdown(content || '');
            msgDiv.innerHTML = `
                    <div class="message-avatar">🤖</div>
                    <div class="message-content-wrapper">
                        ${thinkingHtml}
                        <div class="message-bubble">${renderedContent || '<span class="typing-indicator"><span></span><span></span><span></span></span>'}</div>
                    </div>
                `;

            // 绑定思考区块折叠事件
            const thinkingBlock = msgDiv.querySelector('.thinking-block');
            if (thinkingBlock) {
                thinkingBlock.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const isCollapsed = this.getAttribute('data-collapsed') === 'true';
                    if (isCollapsed) {
                        this.setAttribute('data-collapsed', 'false');
                        this.classList.remove('collapsed');
                        this.querySelector('.arrow').textContent = '▼';
                    } else {
                        this.setAttribute('data-collapsed', 'true');
                        this.classList.add('collapsed');
                        this.querySelector('.arrow').textContent = '▶';
                    }
                });
            }

            chatContainer.appendChild(msgDiv);
            highlightCodeBlocks(msgDiv);
            addCopyButtons(msgDiv);
            scrollToBottom(true);

            if (save && content) {
                messages.push({
                    role: 'assistant',
                    content: content,
                    thinkingContent: thinkingContent || ''
                });
                saveConversation();
            }

            return msgDiv;
        }

        function updateAssistantMessage(msgDiv, content, thinkingContent) {
            const bubble = msgDiv.querySelector('.message-bubble');
            if (bubble) {
                if (content) {
                    // 移除流式光标后重新渲染
                    const cursor = bubble.querySelector('.streaming-cursor');
                    if (cursor) cursor.remove();
                    bubble.innerHTML = renderMarkdown(content);
                    // 如果还在生成中，添加流式光标
                    if (isGenerating) {
                        const cursorSpan = document.createElement('span');
                        cursorSpan.className = 'streaming-cursor';
                        bubble.appendChild(cursorSpan);
                    }
                } else {
                    bubble.innerHTML =
                        '<span class="typing-indicator"><span></span><span></span><span></span></span>';
                }
            }

            // 更新或创建思考区块
            let thinkingBlock = msgDiv.querySelector('.thinking-block');
            if (thinkingContent && thinkingContent.trim()) {
                if (!thinkingBlock) {
                    thinkingBlock = document.createElement('div');
                    thinkingBlock.className = 'thinking-block';
                    thinkingBlock.setAttribute('data-collapsed', 'false');
                    thinkingBlock.innerHTML = `
                            <div class="thinking-header">
                                <span class="arrow">▼</span> 💭 <span>深度思考</span>
                            </div>
                            <div class="thinking-content"></div>
                        `;
                    thinkingBlock.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const isCollapsed = this.getAttribute('data-collapsed') === 'true';
                        if (isCollapsed) {
                            this.setAttribute('data-collapsed', 'false');
                            this.classList.remove('collapsed');
                            this.querySelector('.arrow').textContent = '▼';
                        } else {
                            this.setAttribute('data-collapsed', 'true');
                            this.classList.add('collapsed');
                            this.querySelector('.arrow').textContent = '▶';
                        }
                    });
                    const wrapper = msgDiv.querySelector('.message-content-wrapper');
                    wrapper.insertBefore(thinkingBlock, wrapper.firstChild);
                }
                const thinkingContentEl = thinkingBlock.querySelector('.thinking-content');
                if (thinkingContentEl) {
                    thinkingContentEl.textContent = thinkingContent;
                }
            }

            highlightCodeBlocks(msgDiv);
            addCopyButtons(msgDiv);
            scrollToBottom(true);
        }

        function finalizeAssistantMessage(msgDiv, content, thinkingContent) {
            // 移除流式光标
            const bubble = msgDiv.querySelector('.message-bubble');
            if (bubble) {
                const cursor = bubble.querySelector('.streaming-cursor');
                if (cursor) cursor.remove();
                bubble.innerHTML = renderMarkdown(content || '');
            }
            highlightCodeBlocks(msgDiv);
            addCopyButtons(msgDiv);

            // 更新messages中最后一条assistant消息
            let found = false;
            for (let i = messages.length - 1; i >= 0; i--) {
                if (messages[i].role === 'assistant') {
                    messages[i].content = content;
                    messages[i].thinkingContent = thinkingContent || '';
                    found = true;
                    break;
                }
            }
            if (!found && content) {
                messages.push({
                    role: 'assistant',
                    content: content,
                    thinkingContent: thinkingContent || ''
                });
            }
            saveConversation();
            scrollToBottom(true);

            // 流式结束后自动折叠思考区块
            const thinkingBlock = msgDiv.querySelector('.thinking-block');
            if (thinkingBlock && thinkingContent && thinkingContent.trim()) {
                setTimeout(() => {
                    thinkingBlock.setAttribute('data-collapsed', 'true');
                    thinkingBlock.classList.add('collapsed');
                    const arrow = thinkingBlock.querySelector('.arrow');
                    if (arrow) arrow.textContent = '▶';
                }, 600);
            }
        }

        // ==================== Markdown 渲染 ====================
        function renderMarkdown(text) {
            if (!text) return '';
            try {
                if (typeof marked !== 'undefined') {
                    marked.setOptions({
                        breaks: true,
                        gfm: true,
                    });
                    let html = marked.parse(text);
                    // 给代码块添加包装以便添加复制按钮
                    html = html.replace(/<pre><code/g, '<div class="code-block-wrapper"><pre><code');
                    html = html.replace(/<\/code><\/pre>/g, '</code></pre></div>');
                    return html;
                }
            } catch (e) {
                console.warn('Markdown 渲染失败:', e);
            }
            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        function highlightCodeBlocks(element) {
            if (typeof hljs !== 'undefined') {
                element.querySelectorAll('pre code').forEach(block => {
                    try {
                        hljs.highlightElement(block);
                    } catch (e) {
                        // 忽略高亮错误
                    }
                });
            }
        }

        function addCopyButtons(element) {
            element.querySelectorAll('.code-block-wrapper').forEach(wrapper => {
                if (wrapper.querySelector('.copy-btn')) return;
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = '📋 复制';
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const code = wrapper.querySelector('code');
                    const text = code ? code.textContent : '';
                    copyToClipboard(text).then(() => {
                        btn.textContent = '✅ 已复制';
                        btn.classList.add('copied');
                        setTimeout(() => {
                            btn.textContent = '📋 复制';
                            btn.classList.remove('copied');
                        }, 2000);
                    });
                });
                wrapper.appendChild(btn);
            });
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text);
            }
            return new Promise((resolve, reject) => {
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    textarea.style.pointerEvents = 'none';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    resolve();
                } catch (e) {
                    reject(e);
                }
            });
        }

        // ==================== API 调用 ====================
        async function sendMessage() {
            if (isGenerating) return;

            const content = userInput.value.trim();
            if (!content) return;

            // 清空输入框
            userInput.value = '';
            autoResizeTextarea();

            // 添加用户消息
            appendUserMessage(content, true);

            // 准备API请求的messages（发送完整对话历史）
            const requestMessages = messages.map(m => ({
                role: m.role,
                content: m.content
            }));

            // 创建助手消息占位
            currentAssistantMessageEl = appendAssistantMessage('', '', false);
            currentThinkingContent = '';
            currentContent = '';
            streamBuffer = '';

            // 设置生成状态
            isGenerating = true;
            abortController = new AbortController();
            updateSendButton();
            stopBtn.classList.add('visible');

            try {
                const requestBody = {
                    model: CONFIG.model,
                    messages: requestMessages,
                    temperature: CONFIG.temperature,
                    top_p: CONFIG.topP,
                    max_tokens: CONFIG.maxTokens,
                    chat_template_kwargs: CONFIG.chatTemplateKwargs,
                    stream: true,
                };

                const response = await fetch(CONFIG.apiEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody),
                    signal: abortController.signal,
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    let errorMessage;
                    try {
                        const errorJson = JSON.parse(errorText);
                        errorMessage = errorJson.error?.message || errorJson.message ||
                            `HTTP ${response.status}`;
                    } catch {
                        errorMessage = `HTTP ${response.status}: ${errorText.substring(0, 200)}`;
                    }
                    throw new Error(errorMessage);
                }

                // 读取流式响应
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    streamBuffer += chunk;

                    // 处理SSE数据
                    const lines = streamBuffer.split('\n');
                    streamBuffer = lines.pop() || '';

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data: ')) continue;

                        const dataStr = trimmed.slice(6);
                        if (dataStr === '[DONE]') continue;

                        try {
                            const data = JSON.parse(dataStr);
                            const delta = data.choices?.[0]?.delta;
                            if (!delta) continue;

                            const reasoningContent = delta.reasoning_content || '';
                            const contentChunk = delta.content || '';

                            if (reasoningContent) {
                                currentThinkingContent += reasoningContent;
                            }
                            if (contentChunk) {
                                currentContent += contentChunk;
                            }

                            // 更新界面
                            updateAssistantMessage(
                                currentAssistantMessageEl,
                                currentContent,
                                currentThinkingContent
                            );

                        } catch (parseErr) {
                            // 忽略解析错误，继续处理
                        }
                    }
                }

                // 流结束，最终更新
                finalizeAssistantMessage(
                    currentAssistantMessageEl,
                    currentContent,
                    currentThinkingContent
                );

            } catch (error) {
                if (error.name === 'AbortError') {
                    // 用户主动停止
                    const stopNote = '\n\n*(已停止生成)*';
                    const finalContent = currentContent ? currentContent + stopNote : '*(已停止生成)*';
                    finalizeAssistantMessage(
                        currentAssistantMessageEl,
                        finalContent,
                        currentThinkingContent
                    );
                } else {
                    console.error('API 请求失败:', error);
                    const errorMsg = error.message || '未知错误';
                    updateAssistantMessage(
                        currentAssistantMessageEl,
                        `❌ **出错了**：${errorMsg}\n\n请检查网络连接或稍后重试。`,
                        currentThinkingContent
                    );
                    finalizeAssistantMessage(
                        currentAssistantMessageEl,
                        `❌ **出错了**：${errorMsg}\n\n请检查网络连接或稍后重试。`,
                        currentThinkingContent
                    );
                    showToast('请求失败: ' + errorMsg, 'error');
                }
            } finally {
                isGenerating = false;
                abortController = null;
                currentAssistantMessageEl = null;
                currentThinkingContent = '';
                currentContent = '';
                streamBuffer = '';
                updateSendButton();
                stopBtn.classList.remove('visible');
                updateEmptyState();
                userInput.focus();
            }
        }

        function stopGeneration() {
            if (abortController && isGenerating) {
                abortController.abort();
            }
        }

        // ==================== UI 辅助 ====================
        function updateSendButton() {
            if (isGenerating) {
                sendBtn.disabled = true;
                sendBtn.classList.add('loading');
            } else {
                sendBtn.disabled = false;
                sendBtn.classList.remove('loading');
            }
        }

        function scrollToBottom(smooth = true) {
            requestAnimationFrame(() => {
                if (smooth) {
                    chatContainer.scrollTo({
                        top: chatContainer.scrollHeight,
                        behavior: 'smooth'
                    });
                } else {
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            });
        }

        function autoResizeTextarea() {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;',
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        function showToast(message, type = '') {
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ==================== 事件处理 ====================
        function setupEventListeners() {
            // 发送按钮
            sendBtn.addEventListener('click', sendMessage);

            // 停止按钮
            stopBtn.addEventListener('click', stopGeneration);

            // 回车发送，Shift+Enter换行
            userInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!isGenerating && userInput.value.trim()) {
                        sendMessage();
                    }
                }
            });

            // 自动调整输入框高度
            userInput.addEventListener('input', autoResizeTextarea);

            // 主题切换
            themeToggle.addEventListener('click', toggleTheme);

            // 清空对话
            clearChatBtn.addEventListener('click', clearConversation);

            // 建议按钮绑定
            bindSuggestionChips();

            // 监听系统主题变化
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                const saved = localStorage.getItem(CONFIG.themeKey);
                if (!saved) {
                    setTheme(e.matches ? 'dark' : 'light', false);
                }
            });

            // 移动端触摸优化
            document.addEventListener('touchstart', function() {}, { passive: true });
        }

        function bindSuggestionChips() {
            bindSuggestionChipsInElement(document);
        }

        function bindSuggestionChipsInElement(root) {
            root.querySelectorAll('.suggestion-chip').forEach(chip => {
                if (chip._bound) return;
                chip._bound = true;
                chip.addEventListener('click', function() {
                    const prompt = this.getAttribute('data-prompt');
                    if (prompt && !isGenerating) {
                        userInput.value = prompt;
                        autoResizeTextarea();
                        sendMessage();
                    }
                });
            });
        }

        // ==================== 启动应用 ====================
        init();

        // ==================== 调试信息 ====================
        console.log('🤖 DeepSeek V4 Flash 聊天助手已就绪');
        console.log('  模型:', CONFIG.model);
        console.log('  API端点:', CONFIG.apiEndpoint);
        console.log('  主题:', document.body.getAttribute('data-theme'));
        console.log('  对话历史:', messages.length, '条消息');
        console.log('  推理模式: thinking=true, reasoning_effort=high');
        console.log('  🎨 点击 🌓 切换深色/浅色主题');
        console.log('  📱 支持移动端响应式布局');
    })();
</script>
</body>
</html>
